<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="main.css">
	<title>Rock-Paper-Scissors</title>
</head>
<body>
	<div class="main">
		<h1>Rock-Paper-Scissors</h1>
		<div class="score-board">
			<div>
				<h3>Player</h3>
				<p class="player-score">0</p>
			</div>
			<div>
				<h3>CPU</h3>
				<p class="cpu-score">0</p>
			</div>
		</div>
		<div class="moves">
			<div class="player">
				<h1 class="player-move">Press</h1>
				<h3>Player</h3>
			</div>
			<div class="cpu">
				<h1 class="cpu-move">Button</h1>
				<h3>CPU</h3>
			</div>
		</div>
		<div class="options">
			<button>ROCK</button>
			<button>PAPER</button>
			<button>SCISSORS</button>
		</div>
		<div class="message hidden">
			<h3>Message</h3>
		</div>
		<div class="footer">
			<p>Made by Fardeen776</p>
		</div>
	</div>
	<script defer src="main.js"></script>
</body>
</html>
